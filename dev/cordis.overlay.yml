# Local development overlay: run from the deepseek-harness source checkout
# with this plugin loaded straight from the built lib and a demo SQLite db.
# Nothing here is machine-specific — substitute your own checkout locations
# for the `/path/to/...` placeholders below.
#
#   cd /path/to/deepseek-harness
#   pnpm dsh web --patch /path/to/data-agent/dev/cordis.overlay.yml
#
# The row references the BUILT entry (run `npm run build` in the data-agent
# checkout first). Node module resolution walks up from lib/index.js, so
# @deepseek-ai/* externals resolve through data-agent/node_modules
# (scripts/link-dsh.mjs). Relative sqlite `file` paths resolve against the
# plugin package root; to point at a database elsewhere use an absolute path
# or an env reference, e.g. `file: !!js process.env.DATA_AGENT_DEMO_DB`.

- insert:
    - id: dsh-data-analysis
      name: 'dsh-data-analysis-agent'
      config:
        dataSources:
          - name: demo
            type: sqlite
            file: './demo/demo.db'
            approvalMode: auto
          - name: spark-lake
            type: spark
            approvalMode: auto
          # MySQL example — credentials via env, never inline:
          # - name: prod-mysql
          #   type: mysql
          #   host: 10.0.0.5
          #   port: 3306
          #   database: shop
          #   user: analytics_ro
          #   password: !!js process.env.MYSQL_ANALYTICS_PASSWORD
          #   approvalMode: ask
